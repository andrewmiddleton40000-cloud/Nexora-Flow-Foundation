openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: assistant
    description: Workspace-authorized AI assistance
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /assistant/usage:
    get:
      operationId: getAssistantUsage
      tags: [assistant]
      summary: Get assistant configuration and workspace usage
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Assistant configuration and current workspace quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantUsageResponse"
        "401":
          $ref: "#/components/responses/AssistantError"
        "403":
          $ref: "#/components/responses/AssistantError"
        "503":
          $ref: "#/components/responses/AssistantError"
  /assistant/generate:
    post:
      operationId: generateAssistantContent
      tags: [assistant]
      summary: Generate a grounded CRM summary, email draft, or next-step suggestions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantGenerateBody"
      responses:
        "200":
          description: Generated assistant content and updated workspace quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantGenerationResponse"
        "400":
          $ref: "#/components/responses/AssistantError"
        "401":
          $ref: "#/components/responses/AssistantError"
        "403":
          $ref: "#/components/responses/AssistantError"
        "404":
          $ref: "#/components/responses/AssistantError"
        "429":
          $ref: "#/components/responses/AssistantError"
        "503":
          $ref: "#/components/responses/AssistantError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    AssistantError:
      description: The request could not be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AssistantError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AssistantAction:
      type: string
      enum: [summary, email_draft, next_steps]
    AssistantUsageResponse:
      type: object
      properties:
        configured:
          type: boolean
        plan:
          type: string
          enum: [free, growth, pro]
        dailyUsed:
          type: integer
          minimum: 0
        dailyLimit:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
        resetsAt:
          type: string
          format: date-time
      required: [configured, plan, dailyUsed, dailyLimit, remaining, resetsAt]
    AssistantGenerateBody:
      type: object
      additionalProperties: false
      properties:
        workspaceId:
          type: string
          format: uuid
        contactId:
          type: string
          format: uuid
        action:
          $ref: "#/components/schemas/AssistantAction"
        guidance:
          type: string
          maxLength: 400
      required: [workspaceId, contactId, action]
    AssistantGenerationResponse:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/AssistantAction"
        content:
          type: string
          minLength: 1
          maxLength: 8000
        contactName:
          type: string
        contactEmail:
          type: [string, "null"]
        usage:
          $ref: "#/components/schemas/AssistantUsageResponse"
      required: [action, content, contactName, contactEmail, usage]
    AssistantError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required: [code, message]

